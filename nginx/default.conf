server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    # Admin backend API + UI
    location /admin {
        proxy_pass http://host.docker.internal:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/admin {
        proxy_pass http://host.docker.internal:8080/api/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tenant self-service panel
    location /tenant {
        proxy_pass http://host.docker.internal:8080/tenant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/tenant {
        proxy_pass http://host.docker.internal:8080/api/tenant;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WhatsApp management UI
    location /whatsapp/ {
        proxy_pass http://host.docker.internal:8800/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /whatsapp {
        return 302 /whatsapp/;
    }

    # Default
    location / {
        return 302 /admin;
    }
}
